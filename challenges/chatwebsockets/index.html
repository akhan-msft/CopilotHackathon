<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebSocket Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* ── Login Screen ── */
    #login-screen {
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      width: 520px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
    }

    #login-screen h2 { margin-bottom: 20px; text-align: center; color: #333; }

    #user-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 2px solid #e4e6eb;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }

    .user-card:hover { border-color: #0a7cff; background: #f0f7ff; }

    .user-card img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
    }

    .user-card span { font-size: 14px; font-weight: 500; color: #333; }

    #loading { text-align: center; color: #888; padding: 20px 0; }

    /* ── Chat Screen ── */
    #chat-screen {
      display: none;
      flex-direction: column;
      width: 520px;
      height: 600px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
      overflow: hidden;
    }

    #chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: #0a7cff;
      color: #fff;
    }

    #chat-header img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
    }

    #chat-header span { font-size: 16px; font-weight: 600; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 85%;
    }

    .msg.own { align-self: flex-end; flex-direction: row-reverse; }

    .msg img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .bubble {
      background: #e4e6eb;
      padding: 8px 12px;
      border-radius: 16px;
    }

    .msg.own .bubble { background: #0a7cff; color: #fff; }

    .bubble .sender {
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 2px;
      opacity: .75;
    }

    .bubble .text { font-size: 14px; }

    .system-msg {
      text-align: center;
      font-size: 12px;
      color: #aaa;
    }

    #input-area {
      display: flex;
      padding: 12px 16px;
      gap: 10px;
      border-top: 1px solid #e4e6eb;
    }

    #msg-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
      font-size: 14px;
    }

    #msg-input:focus { border-color: #0a7cff; }

    #send-btn {
      padding: 10px 20px;
      background: #0a7cff;
      color: #fff;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    #send-btn:hover { background: #0060df; }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen">
    <h2>Choose your user</h2>
    <div id="loading">Loading users…</div>
    <div id="user-list"></div>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen">
    <div id="chat-header">
      <img id="header-avatar" src="" alt="avatar" />
      <span id="header-name"></span>
    </div>
    <div id="messages"></div>
    <div id="input-area">
      <input id="msg-input" type="text" placeholder="Type a message…" autocomplete="off" />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const socket = io();

    let currentUser = null;

    // ── Load users ──
    fetch("/api/users")
      .then(r => r.json())
      .then(users => {
        const loading = document.getElementById("loading");
        const list = document.getElementById("user-list");
        loading.remove();
        users.forEach(user => {
          const card = document.createElement("div");
          card.className = "user-card";
          card.innerHTML = `<img src="${user.avatar}" alt="${user.name}" /><span>${user.name}</span>`;
          card.addEventListener("click", () => selectUser(user));
          list.appendChild(card);
        });
      })
      .catch(() => {
        document.getElementById("loading").textContent = "Failed to load users.";
      });

    // ── Select user and go to chat ──
    function selectUser(user) {
      currentUser = user;
      document.getElementById("header-avatar").src = user.avatar;
      document.getElementById("header-name").textContent = user.name;
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("chat-screen").style.display = "flex";
      document.getElementById("msg-input").focus();
    }

    // ── Send message ──
    function sendMessage() {
      const input = document.getElementById("msg-input");
      const text = input.value.trim();
      if (!text || !currentUser) return;
      socket.emit("message", { user: currentUser.name, avatar: currentUser.avatar, text });
      input.value = "";
    }

    document.getElementById("send-btn").addEventListener("click", sendMessage);
    document.getElementById("msg-input").addEventListener("keydown", e => {
      if (e.key === "Enter") sendMessage();
    });

    // ── Receive message ──
    socket.on("message", data => {
      const messages = document.getElementById("messages");
      const isOwn = currentUser && data.user === currentUser.name;

      const row = document.createElement("div");
      row.className = "msg" + (isOwn ? " own" : "");
      row.innerHTML = `
        <img src="${data.avatar}" alt="${data.user}" />
        <div class="bubble">
          <div class="sender">${data.user}</div>
          <div class="text">${escapeHtml(data.text)}</div>
        </div>`;
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
    });

    // prevent XSS
    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
