<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Part Details – AutoParts eShop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="stylesheet" href="css/product.css"/>
</head>
<body class="bg-light">

<!-- ══════════════════════════════ NAVBAR ═══════════════════════════════ -->
<nav class="navbar navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="index.html">Auto<span class="text-danger">Parts</span> eShop</a>
        <button class="btn btn-danger" id="cart-btn" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas">
            <i class="bi bi-cart3 me-1"></i>Cart
            <span class="badge rounded-pill bg-white text-danger ms-1" id="cart-count">0</span>
        </button>
    </div>
</nav>

<!-- ════════════════════════ DETAIL SECTION ══════════════════════════════ -->
<div class="container py-4">
    <a href="index.html" class="btn btn-outline-secondary btn-sm mb-4">
        <i class="bi bi-arrow-left me-1"></i>Back to Products
    </a>
    <div class="card shadow-sm">
        <div class="row g-0">
            <div class="col-md-5">
                <div id="detail-img" class="d-flex align-items-center justify-content-center rounded-start w-100"
                     style="min-height:320px;max-height:440px;background:#eef0f4">
                    <i id="detail-icon" class="text-white" style="font-size:5rem;opacity:.85"></i>
                </div>
            </div>
            <div class="col-md-7">
                <div class="card-body p-4" id="detail-info">
                    <h2 id="detail-name" class="fw-bold mb-1">Loading…</h2>
                    <p id="detail-mfg" class="text-muted small mb-3"></p>
                    <p id="detail-desc" class="text-secondary mb-4"></p>
                    <p id="detail-price" class="fs-2 fw-bold text-danger mb-4"></p>

                    <h6 class="text-uppercase text-muted fw-semibold small mb-2">Specifications</h6>
                    <table id="specs-table" class="table table-sm table-striped mb-4"
                           style="max-width:380px"></table>

                    <p id="detail-compat" class="small text-muted mb-4"></p>

                    <div class="d-flex align-items-center gap-3 flex-wrap">
                        <button class="btn btn-dark btn-lg px-4" id="btn-add-detail">
                            <i class="bi bi-cart-plus me-2"></i>Add to Cart
                        </button>
                        <span id="detail-stock-label" class="badge fs-6 py-2 px-3 bg-success"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ═══════════════════════════ CART OFFCANVAS ══════════════════════════ -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="cartOffcanvas"
     aria-labelledby="cartOffcanvasLabel" style="width:380px">
    <div class="offcanvas-header border-bottom">
        <h5 class="offcanvas-title" id="cartOffcanvasLabel">
            <i class="bi bi-cart3 me-2"></i>Shopping Cart
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column p-0">
        <div id="cart-items-list" class="flex-grow-1 overflow-auto p-3"></div>
        <div id="cart-empty-msg"
             class="flex-grow-1 d-flex flex-column align-items-center justify-content-center text-muted d-none">
            <i class="bi bi-cart-x fs-1 mb-2 opacity-25"></i>
            Your cart is empty.
        </div>
        <div class="border-top p-3">
            <div id="cart-total" class="d-none fw-bold fs-5 text-end mb-3"></div>
            <button class="btn btn-outline-danger w-100 btn-sm d-none" id="clear-cart-btn" type="button">
                <i class="bi bi-trash me-1"></i>Clear Cart
            </button>
        </div>
    </div>
</div>

<!-- ════════════════════════════ SCRIPTS ════════════════════════════════ -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/product-images.js"></script>
<script src="js/cart.js"></script>
<script src="js/product.js"></script>
</body>
</html>
