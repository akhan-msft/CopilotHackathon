<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AutoParts eShop</title>

    <!-- jQuery UI theme -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/smoothness/jquery-ui.css"/>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<!-- ═══════════════════════════ HEADER ═══════════════════════════ -->
<div id="header">
    <h1>Auto<span>Parts</span> eShop</h1>
    <button id="cart-btn">🛒 Cart <span id="cart-count">0</span></button>
</div>

<!-- ═══════════════════════════ CONTROLS ════════════════════════ -->
<div id="controls">
    <input type="text" id="search-input" placeholder="Search by name, manufacturer, description…"/>
    <button id="search-btn">Search</button>
    <button id="reset-btn">Reset</button>

    <div id="price-filter-wrap">
        <span>Price:</span>
        <div id="price-slider"></div>
        <span id="price-range-label">$0 – $250</span>
    </div>
</div>

<!-- ═══════════════════════════ MAIN ════════════════════════════ -->
<div id="main">
    <div id="product-grid"></div>
    <div id="no-results">No products match your search.</div>
    <div id="pagination"></div>
</div>

<!-- ═══════════════════════════ CART DIALOG ══════════════════════ -->
<div id="cart-dialog" title="🛒 Shopping Cart" style="display:none;">
    <div id="cart-items-list"></div>
    <div id="cart-empty-msg" style="display:none;">Your cart is empty.</div>
    <div id="cart-total"></div>
</div>

<!-- ═══════════════════════════ SCRIPTS ═════════════════════════ -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
</body>
</html>
